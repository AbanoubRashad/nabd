%% Nabd topic ACL. First match wins; anything unmatched is denied (authorization.no_match = deny).
%%
%% ${username} is the authenticated MQTT username, so a device can only touch its own subtree
%% nabd/v1/{site}/{its own id}/... and cannot read another device's commands or publish its telemetry.

%% Devices (and the simulator, which connects as each device with that device's own credentials).
{allow, {username, {re, "^nabd-[0-9]{2,4}$"}}, publish,
  ["nabd/v1/+/${username}/telemetry", "nabd/v1/+/${username}/status", "nabd/v1/+/${username}/cmd/ack"]}.
{allow, {username, {re, "^nabd-[0-9]{2,4}$"}}, subscribe,
  ["nabd/v1/+/${username}/cmd", "nabd/v1/+/${username}/ota"]}.

%% Ingest: reads telemetry and status through a shared subscription so it can scale out. Never publishes.
{allow, {username, "svc-ingest"}, subscribe,
  ["$share/ingest/nabd/v1/+/+/telemetry", "$share/ingest/nabd/v1/+/+/status",
   "nabd/v1/+/+/telemetry", "nabd/v1/+/+/status"]}.

%% API: reads the live stream for WebSocket fan-out and command acks; publishes commands and OTA offers.
{allow, {username, "svc-api"}, subscribe,
  ["nabd/v1/+/+/telemetry", "nabd/v1/+/+/status", "nabd/v1/+/+/cmd/ack"]}.
{allow, {username, "svc-api"}, publish, ["nabd/v1/+/+/cmd", "nabd/v1/+/+/ota"]}.

{deny, all}.
