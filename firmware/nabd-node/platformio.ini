; Nabd node firmware: one ESP32-S3 board, one firmware, device profile chosen at provisioning.
; Arduino-ESP32 core 3.x through the pioarduino platform fork (the upstream espressif32 platform stops at core 2.x).

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DNABD_FW_VERSION=\"1.4.2\"

; Host-side unit tests for the pure logic (payload encoder, ring buffer, command parser).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DNABD_NATIVE
