; Nabd node firmware: one ESP32-S3 board, one firmware, device profile chosen at provisioning.
; Arduino-ESP32 core 3.x through the pioarduino platform fork (the upstream espressif32 platform stops at core 2.x).

[platformio]
default_envs = esp32s3

[env]
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DNABD_FW_VERSION=\"1.4.2\"
lib_deps =
    ${env.lib_deps}
    tzapu/WiFiManager @ ^2.0.17
    adafruit/Adafruit INA219 @ ^1.2.3
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.4
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.12.1

; Host-side unit tests for the pure logic (payload encoder, ring buffer, command parser, median filter,
; backoff). Run with `pio test -e native` (needs a host gcc; CI runs it on Linux).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DNABD_NATIVE -Ilib/nabd_core/src
