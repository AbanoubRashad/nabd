<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13">
  <title>Nabd node wiring: ESP32-S3 DevKitC-1 with INA219, SHT31, SSD1306, DS18B20, reed switch, soil probe, relays and buttons</title>
  <rect width="980" height="620" fill="#0A0E13"/>
  <text x="24" y="34" fill="#E7EDF3" font-size="18" font-weight="600">Nabd node wiring · ESP32-S3 DevKitC-1</text>
  <text x="24" y="54" fill="#93A3B5">Red 3V3 · black GND · blue I²C · green signals. All modules run at 3.3 V logic.</text>

  <!-- board -->
  <rect x="380" y="90" width="220" height="440" rx="14" fill="#10161E" stroke="#2E3B4B" stroke-width="2"/>
  <text x="490" y="118" fill="#E7EDF3" text-anchor="middle" font-weight="600">ESP32-S3</text>
  <text x="490" y="136" fill="#93A3B5" text-anchor="middle" font-size="11">DevKitC-1</text>
  <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#B9C5D2">
    <text x="392" y="176">3V3</text><text x="392" y="206">GND</text>
    <text x="392" y="246">GPIO 8 · SDA</text><text x="392" y="276">GPIO 9 · SCL</text>
    <text x="392" y="336">GPIO 10 · 1-Wire</text><text x="392" y="376">GPIO 11 · door</text>
    <text x="392" y="416">GPIO 1 · soil ADC</text>
    <text x="588" y="246" text-anchor="end">GPIO 4 · relay 1</text><text x="588" y="286" text-anchor="end">GPIO 5 · relay 2</text>
    <text x="588" y="346" text-anchor="end">GPIO 12 · override</text><text x="588" y="386" text-anchor="end">GPIO 0 · BOOT</text>
  </g>

  <!-- I2C devices -->
  <g>
    <rect x="40" y="90" width="230" height="56" rx="10" fill="#161E28" stroke="#2E3B4B"/>
    <text x="54" y="114" fill="#E7EDF3" font-weight="600">INA219 · 0x40 (load)</text>
    <text x="54" y="133" fill="#93A3B5" font-size="11">VIN+/VIN− in series with the load · bus ≤ 26 V</text>
    <rect x="40" y="160" width="230" height="44" rx="10" fill="#161E28" stroke="#2E3B4B"/>
    <text x="54" y="187" fill="#E7EDF3" font-weight="600">INA219 · 0x41 (panel, optional)</text>
    <rect x="40" y="218" width="230" height="44" rx="10" fill="#161E28" stroke="#2E3B4B"/>
    <text x="54" y="245" fill="#E7EDF3" font-weight="600">SHT31 · 0x44</text>
    <rect x="40" y="276" width="230" height="44" rx="10" fill="#161E28" stroke="#2E3B4B"/>
    <text x="54" y="303" fill="#E7EDF3" font-weight="600">SSD1306 OLED · 0x3C</text>
  </g>
  <path d="M270 118 H330 V242 H380 M270 182 H330 M270 240 H330 M270 298 H330 V242" fill="none" stroke="#6CB4FF" stroke-width="2"/>
  <path d="M270 128 H340 V272 H380 M270 192 H340 M270 250 H340 M270 308 H340" fill="none" stroke="#6CB4FF" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="342" fill="#6CB4FF" font-size="11">SDA solid · SCL dashed</text>

  <!-- 1-Wire, door, soil -->
  <rect x="40" y="350" width="230" height="56" rx="10" fill="#161E28" stroke="#2E3B4B"/>
  <text x="54" y="374" fill="#E7EDF3" font-weight="600">DS18B20 waterproof probe</text>
  <text x="54" y="393" fill="#93A3B5" font-size="11">data + 4.7 kΩ pull-up to 3V3</text>
  <path d="M270 378 H320 V332 H380" fill="none" stroke="#3DDC97" stroke-width="2"/>
  <rect x="40" y="420" width="230" height="44" rx="10" fill="#161E28" stroke="#2E3B4B"/>
  <text x="54" y="447" fill="#E7EDF3" font-weight="600">Reed switch (door) to GND</text>
  <path d="M270 442 H330 V372 H380" fill="none" stroke="#3DDC97" stroke-width="2"/>
  <rect x="40" y="478" width="230" height="44" rx="10" fill="#161E28" stroke="#2E3B4B"/>
  <text x="54" y="505" fill="#E7EDF3" font-weight="600">Capacitive soil probe (AOUT)</text>
  <path d="M270 500 H340 V412 H380" fill="none" stroke="#3DDC97" stroke-width="2"/>

  <!-- relays and buttons -->
  <rect x="700" y="210" width="250" height="56" rx="10" fill="#161E28" stroke="#2E3B4B"/>
  <text x="714" y="234" fill="#E7EDF3" font-weight="600">Relay module 1 (opto-isolated)</text>
  <text x="714" y="253" fill="#93A3B5" font-size="11">IN · switches a contactor, never mains directly</text>
  <path d="M600 242 H700" fill="none" stroke="#3DDC97" stroke-width="2"/>
  <rect x="700" y="276" width="250" height="44" rx="10" fill="#161E28" stroke="#2E3B4B"/>
  <text x="714" y="303" fill="#E7EDF3" font-weight="600">Relay module 2 (R1 profile)</text>
  <path d="M600 282 H650 V298 H700" fill="none" stroke="#3DDC97" stroke-width="2"/>
  <rect x="700" y="330" width="250" height="44" rx="10" fill="#161E28" stroke="#2E3B4B"/>
  <text x="714" y="357" fill="#E7EDF3" font-weight="600">Override button to GND (R1)</text>
  <path d="M600 342 H700" fill="none" stroke="#3DDC97" stroke-width="2"/>
  <rect x="700" y="384" width="250" height="44" rx="10" fill="#161E28" stroke="#2E3B4B"/>
  <text x="714" y="411" fill="#E7EDF3" font-weight="600">BOOT: hold 5 s = factory reset</text>
  <path d="M600 382 H650 V406 H700" fill="none" stroke="#F5B13D" stroke-width="2"/>

  <!-- power -->
  <path d="M380 172 H360 V560 H160 V522" fill="none" stroke="#FF7468" stroke-width="2"/>
  <path d="M380 202 H350 V575 H120 V522" fill="none" stroke="#6B7B8D" stroke-width="2"/>
  <text x="380" y="596" fill="#93A3B5" font-size="12">3V3 and GND go to every module. Relay modules may need 5 V on VCC with 3V3-tolerant inputs: check the board.</text>
</svg>
