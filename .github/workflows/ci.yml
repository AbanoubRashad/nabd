name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration (TimescaleDB via Testcontainers)
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@nabd/db...
      - run: pnpm test:int

  e2e:
    name: End-to-end (Playwright against the production build)
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@nabd/web... --filter=@nabd/demo...
      - run: pnpm --filter @nabd/web exec playwright install --with-deps chromium
      # The one-process demo (in-memory broker, simulator, ingest, rules and API) serves the live tests:
      # live updates, the relay reaching "Device confirmed", keyboard control and the demo command rules.
      - run: |
          PORT=4000 DEMO_BACKFILL_HOURS=1 node apps/demo/dist/main.js &
          pnpm --filter @nabd/web start &
          npx wait-on http://localhost:4000/healthz http://localhost:3001 --timeout 90000
          pnpm --filter @nabd/web e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: apps/web/e2e/screenshots

  firmware:
    name: Firmware (native tests + ESP32-S3 build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/nabd-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/nabd-node/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: nabd-node-firmware
          path: firmware/nabd-node/.pio/build/esp32s3/firmware.bin

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
